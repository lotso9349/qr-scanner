<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QR掃碼">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>離線 QR 掃碼</title>
<style>
  :root {
    --bg: #0b1220; --card: #141c2f; --line: #25304a; --text: #e8edf7;
    --muted: #8a96b0; --accent: #3b82f6; --ok: #34d399; --warn: #fbbf24; --err: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Helvetica Neue", sans-serif; }
  body { padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px); }
  main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
  .pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.ok { color: var(--ok); border-color: rgba(52,211,153,.4); }
  .pill.warn { color: var(--warn); border-color: rgba(251,191,36,.4); }

  .cam { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #000; border-radius: 18px; overflow: hidden; }
  .cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame { position: absolute; inset: 18%; pointer-events: none; }
  .frame i { position: absolute; width: 28px; height: 28px; border: 4px solid #fff; opacity: .9; }
  .frame i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 10px; }
  .frame i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 10px; }
  .frame i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 10px; }
  .frame i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 10px; }
  .status { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 8px 12px; font-size: 14px;
    text-align: center; border-radius: 10px; background: rgba(11,18,32,.78); backdrop-filter: blur(6px); }
  .status.err { color: var(--err); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .label { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  textarea { width: 100%; background: #0e1526; color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; font-size: 17px; line-height: 1.5; resize: vertical; font-family: inherit; }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button, .btn { appearance: none; border: 1px solid var(--line); background: #1b2540; color: var(--text);
    padding: 12px 16px; border-radius: 12px; font-size: 16px; font-family: inherit; text-decoration: none;
    text-align: center; cursor: pointer; flex: 1 1 auto; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.link { flex: 0 0 auto; padding: 2px 8px; background: none; border: 0; color: var(--accent); font-size: 13px; }
  .tools { display: flex; gap: 8px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  button.hist { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; font-size: 15px; }
  .ht { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hd { font-size: 12px; color: var(--muted); }
  .hidden { display: none !important; }
  .warn { font-size: 13px; line-height: 1.5; color: var(--warn); background: rgba(251,191,36,.08);
    border: 1px solid rgba(251,191,36,.3); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
  .otp-item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: #0e1526; }
  .otp-title { font-size: 17px; font-weight: 600; word-break: break-all; }
  .otp-sub { font-size: 12px; color: var(--muted); margin: 2px 0 8px; word-break: break-all; }
  .otp-secret { font-family: ui-monospace, Menlo, monospace; font-size: 17px; letter-spacing: 1px; word-break: break-all;
    padding: 8px 10px; background: #0b1220; border-radius: 8px; -webkit-user-select: text; user-select: text; }
  .otp-item .row button { font-size: 14px; padding: 9px 10px; }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 28px); transform: translateX(-50%) translateY(20px);
    background: #e8edf7; color: #0b1220; padding: 10px 18px; border-radius: 999px; font-size: 15px; opacity: 0;
    transition: all .25s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<main>
  <header>
    <h1>QR 掃碼</h1>
    <span id="net" class="pill">檢查中…</span>
  </header>

  <section class="cam">
    <video id="video" playsinline muted autoplay></video>
    <div class="frame"><i></i><i></i><i></i><i></i></div>
    <div id="status" class="status">準備中…</div>
  </section>

  <section id="result" class="card hidden">
    <div class="label"><span>掃描結果</span><span id="meta"></span></div>
    <textarea id="text" readonly rows="5"></textarea>
    <div class="row">
      <button id="copy" class="primary">複製文字</button>
      <a id="open" class="btn hidden" target="_blank" rel="noopener">開啟連結</a>
      <button id="again">繼續掃描</button>
    </div>
  </section>

  <section id="otpBox" class="card hidden">
    <div class="label"><span>OTP 帳號</span><span id="otpMeta"></span></div>
    <div class="warn">金鑰等同密碼：不要截圖、不要上傳雲端、不要傳給別人。這些資料只放在畫面記憶體，不會存進手機，關閉或重新整理後就會消失，請先抄寫或備份。</div>
    <div id="otpList"></div>
    <div class="row">
      <button id="otpNext" class="primary">繼續掃描下一張</button>
      <button id="otpCopyAll">複製全部</button>
      <button id="otpShare">分享／儲存備份</button>
      <button id="otpClear">清除</button>
    </div>
  </section>

  <section class="tools">
    <label class="btn" for="file">從相簿選圖</label>
    <input id="file" type="file" accept="image/*" hidden>
    <button id="restart">重新啟動相機</button>
  </section>

  <section id="historyBox" class="card hidden">
    <div class="label"><span>歷史紀錄（只存在這支手機）</span><button id="clear" class="link">清除</button></div>
    <ul id="history"></ul>
  </section>
</main>
<div id="toast"></div>
<script src="otp.js"></script>
<script src="app.js"></script>
</body>
</html>
